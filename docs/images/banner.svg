<text x="402.0" y="64" text-anchor="middle" font-family="'DejaVu Sans','Liberation Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">DECterm 1:  vim LOGIN.COM</text>
<rect x="47" y="78" width="710" height="281" fill="#5e5e5e"/>
<path d="M47,359 H757 V78" stroke="#f2f2f2" stroke-width="2" fill="none"/>
<rect x="50" y="81" width="704" height="275" fill="#0b1117"/>
<rect x="50" y="81" width="704" height="275" fill="url(#glow)"/>
<g font-family="'DejaVu Sans Mono','Liberation Mono','Menlo','Consolas','Courier New',monospace" font-size="17">
<text x="66" y="111" xml:space="preserve"><tspan fill="#7f9fb4">$! LOGIN.COM - edited with Vim on OpenVMS</tspan></text>
<text x="66" y="136" xml:space="preserve"><tspan fill="#d7d7d7">$ </tspan><tspan fill="#ffd75f">set</tspan><tspan fill="#d7d7d7"> terminal/inquire</tspan></text>
<text x="66" y="161" xml:space="preserve"><tspan fill="#d7d7d7">$ </tspan><tspan fill="#ffd75f">define</tspan><tspan fill="#d7d7d7">/nolog tmp sys$scratch</tspan></text>
<text x="66" y="186" xml:space="preserve"><tspan fill="#d7d7d7">$ </tspan><tspan fill="#ffd75f">@</tspan><tspan fill="#d7d7d7">VIM$ROOT:[000000]VIM$SETUP.COM</tspan></text>
<text x="66" y="211" xml:space="preserve"><tspan fill="#d7d7d7">$ </tspan><tspan fill="#ffd75f">if</tspan><tspan fill="#d7d7d7"> f$mode() .eqs. </tspan><tspan fill="#87d787">&quot;INTERACTIVE&quot;</tspan></text>
<text x="66" y="236" xml:space="preserve"><tspan fill="#d7d7d7">$ </tspan><tspan fill="#ffd75f">then</tspan><tspan fill="#d7d7d7"> show time</tspan></text>
<text x="66" y="261" xml:space="preserve"><tspan fill="#ff87af">$ done:</tspan><tspan fill="#d7d7d7"> </tspan><tspan fill="#ffd75f">exit</tspan><tspan fill="#d7d7d7"> </tspan><tspan fill="#d7afff">1</tspan></text>
<text x="66" y="286" xml:space="preserve"><tspan fill="#5f87d7">~</tspan></text>
<rect x="66" y="245" width="10" height="21" fill="#d7d7d7" fill-opacity="0.85"/>
<rect x="64" y="295" width="672" height="22" fill="#d7d7d7"/>
<text x="66" y="311" xml:space="preserve"><tspan fill="#0b1117" font-weight="bold">LOGIN.COM [dcl]</tspan><tspan fill="#0b1117">                            7,1         All</tspan></text>
<text x="66" y="336" xml:space="preserve"><tspan fill="#d7d7d7">"LOGIN.COM" 7L, 214B written</tspan></text>
</g>
