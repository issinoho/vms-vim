# Upstream Vim release this port is built from: a signed tag in github.com/vim/vim.
# fetch.sh verifies the tag against keys/vim-signing-key.asc and checks it points at
# UPSTREAM_COMMIT, then makes the tarball with git archive.
UPSTREAM_NAME=vim
UPSTREAM_VERSION=9.2.1240
UPSTREAM_REPO=https://github.com/vim/vim.git
UPSTREAM_TAG=v9.2.1240
UPSTREAM_COMMIT=8b4ef1f18b20988fac00a26bc4277cd9cc62f272
# Christian Brabandt's tag signing key (keys/vim-signing-key.asc, from keys.openpgp.org).
UPSTREAM_GPG_KEY=4F19708816918E19AAE19DEEF3F92DA383FDDE09
# Our patch level on top of the upstream release (9.2.1240-vms1)
VMS_PATCH_LEVEL=1
